services:
  are-they-alive:
    image: ghcr.io/kostecki/are-they-alive:latest
    restart: unless-stopped
    container_name: are-they-alive
    hostname: are-they-alive
    ports:
      - ${APP_PORT}:3000
    environment:
      BASE_URL: ${BASE_URL}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "nautical-backup.group=are-they-alive"
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    container_name: are-they-alive-redis
    hostname: are-they-alive-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - are-they-alive-redis:/data

volumes:
  are-they-alive-redis:
